[project]
name = "gente-etl"
version = "0.1.0"
description = "ETL local das bases de Gente (quadro, admitidos, demitidos, movimentações, terceiros e orçado) com Polars."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20",
    "fastexcel>=0.12",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
gente-etl = "gente_etl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gente_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # largura fica a cargo do `ruff format`
