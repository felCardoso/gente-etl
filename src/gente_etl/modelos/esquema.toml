# =====================================================================================
# ESQUEMA DA BASE CONSOLIDADA  (contrato com os modelos semânticos)
# =====================================================================================
# A ORDEM das colunas aqui é a ordem na base final (CSV/Parquet).
#
#   nome            nome interno, usado no código Python (snake_case, não mude à toa)
#   saida           nome na base final. Ajuste para ficar IGUAL ao que os modelos
#                   semânticos esperam hoje. Se omitido, usa `nome`.
#   tipo            texto | inteiro | decimal | data | booleano
#   aliases         cabeçalhos aceitos nas planilhas de origem. A comparação ignora
#                   maiúsculas, acentos, espaços e pontuação
#                   ("Data de Admissão" == "DATA_DE_ADMISSAO" == "data de admissao").
#   zeros_esquerda  completa com zeros à esquerda (ex.: CPF = 11)
#   maiusculas      converte o texto para MAIÚSCULAS
#
# Descubra os cabeçalhos reais com:  gente-etl inspecionar "caminho/arquivo.xlsx"
# Antes de adicionar uma coluna aqui, confira na documentação qual fluxo a preenche.
# =====================================================================================

# ---------------------------------------------------------------- identificação / tempo
[[coluna]]
nome = "periodo"
tipo = "data"
aliases = ["COMPETENCIA", "MES_REFERENCIA", "DATA_REFERENCIA", "MES_ANO", "PERIODO"]
descricao = "Sempre o 1º dia do mês a que a linha se refere (ERRO se não for)."

